services:
  - type: web
    name: kahvecell-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: KAHVECELL_JWT_SECRET
        generateValue: true
      - key: KAHVECELL_QR_SECRET
        generateValue: true
      - key: KAHVECELL_CORS_ORIGINS
        sync: false
